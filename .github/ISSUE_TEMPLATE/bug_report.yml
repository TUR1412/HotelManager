name: Bug 报告
description: 报告一个可复现的问题，帮助我们修复
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！为了更快定位问题，请尽量提供完整信息。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请描述实际发生的行为
      placeholder: 运行某命令后提示错误 / 输出不符合预期...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小可复现步骤（命令 + 参数 + 数据）
      placeholder: |
        1. python -m hotelmanager init --db hotelmanager.db
        2. python -m hotelmanager room add ...
        3. python -m hotelmanager booking create ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 应该创建预订/应该提示冲突/应该输出列表...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / 报错信息
      description: 请粘贴完整报错（建议带上 `--verbose`）
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HotelManager 版本
      placeholder: 例如 0.2.0（可用 `python -m hotelmanager --version` 查看）
    validations:
      required: false

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: 例如 3.12.2（可用 `python --version` 查看）
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS / Ubuntu ...
    validations:
      required: false

